<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Divyansh | @theresdivyansh</title>
  <style>
    body {
      background-color: #09090b;
      color: #e4e4e7;
      font-family: 'Courier New', Courier, monospace;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      padding: 20px;
    }
    .card {
      background-color: #121215;
      border: 1px solid #27272a;
      padding: 35px 25px;
      border-radius: 16px;
      text-align: center;
      max-width: 340px;
      width: 100%;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6);
    }
    .status {
      display: inline-block;
      font-size: 11px;
      color: #4ade80;
      background: rgba(74, 222, 128, 0.1);
      padding: 4px 12px;
      border-radius: 20px;
      margin-bottom: 15px;
      border: 1px solid rgba(74, 222, 128, 0.2);
    }
    h1 {
      margin: 0;
      font-size: 24px;
      color: #ffffff;
    }
    .handle {
      color: #71717a;
      font-size: 13px;
      margin-top: 4px;
      margin-bottom: 18px;
    }
    .bio {
      font-size: 13px;
      color: #a1a1aa;
      line-height: 1.6;
      margin-bottom: 22px;
    }
    .skills {
      display: flex;
      justify-content: center;
      gap: 8px;
      flex-wrap: wrap;
      margin-bottom: 25px;
    }
    .tag {
      font-size: 11px;
      background: #18181b;
      border: 1px solid #27272a;
      padding: 5px 10px;
      border-radius: 6px;
      color: #d4d4d8;
    }
    .links {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .btn {
      display: block;
      padding: 12px;
      background-color: #18181b;
      color: #ffffff;
      text-decoration: none;
      border: 1px solid #3f3f46;
      border-radius: 10px;
      font-size: 14px;
      font-weight: bold;
      transition: 0.2s;
    }
    .btn-primary {
      background-color: #4ade80;
      color: #09090b;
      border: none;
    }
  </style>
</head>
<body>

  <div class="card">
    <div class="status">● Building & Learning</div>
    <h1>Divyansh</h1>
    <div class="handle">@theresdivyansh</div>
    
    <p class="bio">Editor & Designer exploring the world of code. Crafting clean visuals and web experiences.</p>

    <div class="skills">
      <span class="tag">Video Editing</span>
      <span class="tag">Design</span>
      <span class="tag">HTML/CSS</span>
    </div>

    <div class="links">
      <a href="https://instagram.com" target="_blank" class="btn btn-primary">Instagram</a>
      <a href="https://github.com" target="_blank" class="btn">GitHub</a>
    </div>
  </div>

</body>
</html>
